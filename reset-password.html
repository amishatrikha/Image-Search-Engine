<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Reset Password &mdash; ImageSearch</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 20px;
        }
        .reset-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.15);
        }
        .reset-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            color: var(--accent);
            font-weight: 700;
            font-size: 1.4rem;
            margin-bottom: 28px;
        }
        .reset-brand i { font-size: 1.8rem; }
        .reset-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }
        .reset-sub {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 24px;
        }
        .reset-msg {
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.9rem;
            margin-bottom: 18px;
            text-align: center;
        }
        .reset-msg.error   { background:#fee2e2; color:#b91c1c; }
        .reset-msg.success { background:#d1fae5; color:#065f46; }
        [data-theme="dark"] .reset-msg.error   { background:rgba(185,28,28,0.25); color:#fca5a5; }
        [data-theme="dark"] .reset-msg.success { background:rgba(6,95,70,0.35);  color:#6ee7b7; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="reset-brand">
            <i class="uil uil-images"></i>
            <span>ImageSearch</span>
        </div>

        <div id="resetMsg" class="reset-msg" hidden></div>

        <div id="resetFormWrap">
            <p class="reset-title">Set a new password</p>
            <p class="reset-sub">Enter a new password for your account.</p>

            <form id="resetForm" novalidate>
                <div class="auth-field">
                    <label for="newPassword">New Password <span class="field-hint">(min 6 characters)</span></label>
                    <div class="password-wrap">
                        <input type="password" id="newPassword" placeholder="New password" required>
                        <button type="button" class="toggle-pw" data-target="newPassword" aria-label="Toggle visibility">
                            <i class="uil uil-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="auth-field">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-wrap">
                        <input type="password" id="confirmPassword" placeholder="Repeat password" required>
                        <button type="button" class="toggle-pw" data-target="confirmPassword" aria-label="Toggle visibility">
                            <i class="uil uil-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="auth-submit" id="resetSubmit">Reset Password</button>
            </form>
        </div>

        <a class="back-link" href="index.html">
            <i class="uil uil-arrow-left"></i> Back to Sign In
        </a>
    </div>

    <script>
        const API_BASE = "http://localhost:5000/api/auth";

        // Apply saved theme
        const theme = localStorage.getItem("px-theme") || "light";
        document.documentElement.setAttribute("data-theme", theme);

        // Get token from URL
        const token = new URLSearchParams(window.location.search).get("token");

        const resetMsg      = document.getElementById("resetMsg");
        const resetFormWrap = document.getElementById("resetFormWrap");
        const resetForm     = document.getElementById("resetForm");
        const resetSubmit   = document.getElementById("resetSubmit");

        if (!token) {
            resetFormWrap.hidden = true;
            resetMsg.className   = "reset-msg error";
            resetMsg.textContent = "Invalid reset link. Please request a new one.";
            resetMsg.hidden      = false;
        }

        // Password visibility toggle
        document.querySelectorAll(".toggle-pw").forEach(btn => {
            btn.addEventListener("click", () => {
                const input  = document.getElementById(btn.dataset.target);
                const isText = input.type === "text";
                input.type   = isText ? "password" : "text";
                btn.querySelector("i").className = isText ? "uil uil-eye" : "uil uil-eye-slash";
            });
        });

        resetForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const password = document.getElementById("newPassword").value;
            const confirm  = document.getElementById("confirmPassword").value;

            if (password.length < 6) {
                showMsg("Password must be at least 6 characters.", "error"); return;
            }
            if (password !== confirm) {
                showMsg("Passwords do not match.", "error"); return;
            }

            resetSubmit.disabled    = true;
            resetSubmit.textContent = "Resetting…";

            try {
                const res  = await fetch(`${API_BASE}/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();
                if (!res.ok) { showMsg(data.error || "Reset failed.", "error"); return; }

                resetFormWrap.hidden = true;
                showMsg("Password reset successfully! Redirecting to sign in…", "success");
                setTimeout(() => window.location.href = "index.html", 2500);
            } catch {
                showMsg("Could not connect to server. Is the backend running?", "error");
            } finally {
                resetSubmit.disabled    = false;
                resetSubmit.textContent = "Reset Password";
            }
        });

        function showMsg(text, type) {
            resetMsg.textContent = text;
            resetMsg.className   = `reset-msg ${type}`;
            resetMsg.hidden      = false;
        }
    </script>
</body>
</html>
